org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# إيقاف الـ New DSL في AGP 9.0 لمنع خطأ BaseAppModuleExtension مع Flutter
android.newDsl=false

# إيقاف الـ Incremental Cache في Kotlin و Gradle لمنع تعليق أو فشل البيلد على Windows
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
kotlin.caching.enabled=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=false
org.gradle.vfs.watch=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
