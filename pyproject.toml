[project]
name = "bioorbit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed-M-Gh", email = "gonimeahmed73@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepface>=0.0.105",
    "fastapi>=0.162.7",
    "langchain-groq>=1.1.3",
    "numpy",
    "opencv-python<5",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
bioorbit = "bioorbit:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
